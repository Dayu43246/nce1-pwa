<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新概念英语一 · 打卡</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b4a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="新一打卡">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
:root{
  --paper:#eef4fc; --paper2:#e2ecf9; --ink:#0f2440; --ink2:#57697f;
  --line:rgba(15,36,64,.12); --blue:#1b4a86; --blue2:#2f74b5;
  --accent:#1f68b0; --accent2:#8ab8e6; --green:#3f7d5c; --card:#ffffff;
  --shadow:0 10px 30px -18px rgba(15,36,64,.45);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),
    radial-gradient(900px 500px at 100% 0%, #dce9fa 0%, rgba(220,233,250,0) 55%),
    var(--paper);
  color:var(--ink); font-size:15px; line-height:1.55;
  min-height:100vh;
}
.wrap{max-width:860px;margin:0 auto;padding:18px 18px 56px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 16px}
.brand{font-size:12px;letter-spacing:.22em;color:var(--ink2);text-transform:uppercase}
.title{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:26px;font-weight:700;line-height:1.2;margin-top:2px}
.title small{font-family:inherit;font-size:13px;color:var(--ink2);font-weight:400;letter-spacing:.04em}
.yearchip{font-size:12px;color:var(--blue);background:rgba(27,74,134,.08);border:1px solid rgba(27,74,134,.16);padding:6px 10px;border-radius:999px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.hero{display:flex;gap:18px;align-items:center;padding:18px}
.ring{width:118px;height:118px;flex:0 0 auto;position:relative}
.ring svg{width:100%;height:100%}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-size:22px;line-height:1}
.ring .pct span{font-size:11px;color:var(--ink2);letter-spacing:.1em}
.heroText{flex:1;min-width:0}
.kpi{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.kpi div{min-width:92px}
.kpi b{display:block;font-size:23px;font-family:Georgia,serif;line-height:1.1}
.kpi span{font-size:12px;color:var(--ink2)}
.heroText p{margin:6px 0 0;color:var(--ink2);font-size:13px}
.heroText p b{color:var(--accent);font-size:15px}
.btn{appearance:none;border:none;cursor:pointer;font:inherit;border-radius:14px;padding:12px 16px;background:var(--blue);color:#ffffff;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.orange{background:var(--accent)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.secTitle{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.secTitle h2{font-size:14px;letter-spacing:.16em;margin:0;color:var(--ink2);font-weight:700;text-transform:uppercase}
.secTitle .hint{font-size:12px;color:var(--ink2)}
.progress{height:9px;background:rgba(15,36,64,.08);border-radius:999px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--blue));border-radius:999px;transition:width .35s}
.progress.warm i{background:linear-gradient(90deg,var(--accent2),var(--accent))}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.cell{position:relative;aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:#ffffff;color:var(--ink2);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;font-variant-numeric:tabular-nums}
.cell.done{background:rgba(27,74,134,.1);border-color:rgba(27,74,134,.25);color:var(--blue)}
.cell.done::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.cell.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px rgba(31,104,176,.16) inset}
.cell.has{background:linear-gradient(180deg,#ffffff,#e9f1fb)}
.cell.timed::before{content:"";position:absolute;left:5px;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.lessonHead{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.back{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
.lessonHead .ln{font-family:Georgia,serif;font-size:19px;font-weight:700}
.lessonHead .ls{font-size:12.5px;color:var(--ink2)}
.pill{font-size:11.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.pill.ok{color:var(--green);border-color:rgba(63,125,92,.3);background:rgba(63,125,92,.07)}
.parts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.part{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#f7fafe}
.part:hover{border-color:rgba(27,74,134,.35)}
.part .pi{width:24px;height:24px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:11px;flex:0 0 auto}
.part b{font-size:14px;font-weight:600}
.part .pd{margin-left:auto;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.timerCard{text-align:center;background:linear-gradient(180deg,#ffffff,#eef4fc)}
.timerCard .tl{font-size:11px;letter-spacing:.22em;color:var(--ink2)}
#timer{font-family:Georgia,serif;font-size:44px;letter-spacing:.02em;line-height:1.15;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tmeta{font-size:12.5px;color:var(--ink2)}
.tbtns{display:flex;gap:10px;justify-content:center;margin:12px 0 4px}
.cats{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:10px 0 2px}
.cat{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;user-select:none}
.cat i{width:8px;height:8px;border-radius:50%;display:block}
.cat.on{border-color:var(--blue);color:var(--blue);font-weight:600;box-shadow:0 2px 8px rgba(27,74,134,.13)}
.catHint{font-size:11.5px;color:var(--ink2);margin-top:6px}
.segline{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.7}
.segline b{color:var(--ink);font-weight:600}
.pieWrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pieLeg{flex:1;min-width:210px}
.pieLeg .row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(15,36,64,.06)}
.pieLeg .row:last-child{border-bottom:none}
.pieLeg .dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.pieLeg .nm{flex:1;white-space:nowrap}
.pieLeg .tm{color:var(--ink2);font-variant-numeric:tabular-nums}
.pieLeg .pc{width:42px;text-align:right;color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums}
.hwItem{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer;position:relative}
.hwItem:last-child{border-bottom:none}
.hwItem.run{background:rgba(27,74,134,.045)}
.hwItem.run .hwText{color:var(--ink)}
.hwOps{display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto;padding-left:8px;padding-top:1px}
.tsec{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:38px;text-align:right}
.hwItem.run .tsec{color:var(--blue);font-weight:700}
.tiny{border:1px solid var(--line);background:#ffffff;border-radius:9px;padding:4px 9px;font:inherit;font-size:11.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tiny:active{transform:translateY(1px)}
.tiny.pri{background:var(--blue);border-color:var(--blue);color:#ffffff;font-weight:600}
.tiny.warm{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.hwText{flex:1;min-width:0}
.runLabel{font-size:12.5px;color:var(--ink2);margin-bottom:2px;min-height:18px}
.runLabel b{color:var(--blue)}
.syncCard{background:linear-gradient(180deg,#ffffff,#eaf2fb);border-color:rgba(27,74,134,.22)}
.syncTop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.syncTop b{font-size:15px;letter-spacing:.02em}
.syncTop .st{font-size:11.5px;color:var(--ink2);margin-top:2px}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(15,36,64,.28);flex:0 0 auto;margin-top:2px;display:grid;place-items:center;color:transparent;font-size:12px}
.hwItem.on .box{background:var(--blue);border-color:var(--blue);color:#fff}
.hwItem.on .hwText{color:var(--ink2);text-decoration:line-through;text-decoration-color:rgba(15,36,64,.25)}
.hwText{font-size:14px}
.hwText em{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:2px}
.mk{padding:12px 0;border-top:1px dashed var(--line)}
.mk:first-of-type{border-top:none;padding-top:2px}
.mkTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mkTop b{font-size:14.5px}
.mkNum{font-size:12.5px;color:var(--blue);font-weight:600;font-variant-numeric:tabular-nums}
.mkHint{font-size:11.5px;color:var(--ink2);margin:2px 0 8px}
.mk textarea{width:100%;min-height:132px;resize:vertical;border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;font:inherit;font-size:13.5px;line-height:1.7;background:#fbfdff;color:var(--ink)}
.mk textarea:focus{outline:2px solid rgba(27,74,134,.18);border-color:rgba(27,74,134,.4)}
.mkFoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.mkTip{font-size:11.5px;color:var(--ink2)}
.mkTip.ok{color:var(--green);font-weight:600}
.linkline{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-size:12.5px;text-decoration:none;border-bottom:1px solid rgba(27,74,134,.25);padding-bottom:1px;margin-top:5px}
.wlist{margin-top:6px}
.w{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid rgba(15,36,64,.07)}
.w:last-child{border-bottom:none}
.w b{font-size:15px;font-weight:600;min-width:96px}
.w .ipa{font-family:"Segoe UI","Arial Unicode MS","Lucida Sans Unicode","DejaVu Sans","Noto Sans",sans-serif;color:var(--blue2);font-size:12.5px}
.w .note{margin-left:auto;font-size:12px;color:var(--ink2);text-align:right;max-width:46%}
.ex{padding:9px 0;border-bottom:1px solid rgba(15,36,64,.07);font-size:14px;color:var(--ink)}
.ex:last-child{border-bottom:none}
.ex i{font-style:normal;color:var(--ink2);font-size:12px;margin-right:8px;font-variant-numeric:tabular-nums}
.empty{font-size:13px;color:var(--ink2);padding:6px 0}
.ref{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ref p{margin:0;font-size:12.5px;color:var(--ink2)}
.footnav{display:flex;gap:10px;margin-top:6px}
.bar{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:8px}
.bar div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.bar i{width:100%;background:linear-gradient(180deg,var(--blue2),var(--blue));border-radius:6px 6px 3px 3px;min-height:3px;display:block}
.bar span{font-size:10.5px;color:var(--ink2)}
.bar em{font-size:10px;color:var(--ink2);font-style:normal}
.statsRow{display:flex;gap:16px;flex-wrap:wrap}
.statsRow div{min-width:110px}
.statsRow b{display:block;font-family:Georgia,serif;font-size:21px}
.statsRow span{font-size:12px;color:var(--ink2)}
label.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-size:13.5px;border-bottom:1px solid rgba(15,36,64,.07)}
label.set:last-of-type{border-bottom:none}
input[type=date],input[type=number]{font:inherit;font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#ffffff;color:var(--ink)}
input[type=text],input[type=password]{font:inherit;font-size:12.5px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#ffffff;color:var(--ink);min-width:190px;max-width:62%;flex:0 1 auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note-box{font-size:12px;color:var(--ink2);line-height:1.7}
.goalstrip{font-size:12.5px;color:var(--ink2);background:rgba(27,74,134,.055);border:1px solid rgba(27,74,134,.12);border-radius:12px;padding:9px 12px;margin:-4px 0 14px}
.goalstrip b{color:var(--accent);font-size:14px}
@media (max-width:560px){
  .hero{flex-direction:column;align-items:flex-start}
  .ring{width:100px;height:100px}
  #timer{font-size:38px}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .cat{justify-content:center}
  .title{font-size:21px}
  .title small{display:block;margin-top:4px;letter-spacing:.02em}
  .kpi{width:100%;gap:12px}
  .kpi div{min-width:0;flex:1}
  .goalstrip{font-size:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
  .part{padding:10px}
  .mk textarea{min-height:120px}
}
</style>
</head>

function dayKey(d){ d = d || new Date(); const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()); }
function thisYearEnd(){ return new Date().getFullYear() + "-12-31"; }
function defaultState(){
  const s = {done:{}, marks:{}, secs:{}, days:{}, seg:{}, itemSec:{}, tasks:{}, make:{}, lastN:41, lastCat:"video", goal:thisYearEnd(), start:40, updatedAt:""};
  for (let i = 1; i <= 40; i++) s.done[i] = 1;   // 用户当前进度：已完成 1–40 课
  return s;
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(!raw) return defaultState();
    const s = JSON.parse(raw);
    return Object.assign(defaultState(), s);

}
let S = load();

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);

function fmt(sec){ sec = Math.max(0, Math.floor(sec||0)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return (h>0 ? String(h).padStart(2,"0")+":" : "") + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0"); }
function fmtLong(sec){ sec = Math.floor(sec||0); const h = Math.floor(sec/3600), m = Math.round(sec%3600/60);
  if (h>0) return h + " 小时 " + (m? m+" 分":"");
  if (m>0) return m + " 分钟";
  return sec>0 ? sec + " 秒" : "0 分钟"; }
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), 1800); }
function doneCount(){ return Object.keys(S.done).length; }
function weekStart(){ const d = new Date(); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); d.setHours(0,0,0,0); return d; }
function weekDone(){ const ws = weekStart(); let c = 0;
  for (const k in S.marks){ const d = new Date(S.marks[k] + "T00:00:00"); if (d >= ws) c++; }
  return c; }
function dayDone(){ const t = dayKey(); let c = 0; for (const k in S.marks) if (S.marks[k] === t) c++; return c; }

function goalInfo(){
  const done = doneCount(), remaining = Math.max(0, TOTAL - done);
  const now = new Date(); const g = new Date(S.goal + "T23:59:59");
  const daysLeft = Math.max(0, Math.ceil((g - now) / 86400000));
  const weeks = daysLeft > 0 ? daysLeft / 7 : 0.2;
  const perWeek = remaining ? Math.ceil(remaining / weeks) : 0;
  const perDay = remaining && daysLeft > 0 ? Math.ceil(remaining / daysLeft) : remaining;
  const wDone = weekDone();
  return { done, remaining, daysLeft, perWeek, perDay, wDone, wStill: Math.max(0, perWeek - wDone) };

let T = { n:null, item:null, cat:"video", on:false, startAt:0, base:0, committed:0 };

  if (!delta || !n) return;
  S.seg = S.seg || {}; S.seg[n] = S.seg[n] || {};
  S.seg[n][cat] = (S.seg[n][cat]||0) + delta;

/* 单条作业累计秒 */
function itemSecOf(n, id){

/* 只把新增的这段算进去：总时长、环节、当天、单条作业 */
function commitTimer(){
  if (!T.n) return;
  const e = Math.round(elapsed());
  const delta = Math.max(0, e - T.committed);
  if (!delta) return;
  S.secs[T.n] = (S.secs[T.n] || 0) + delta;
  addSeg(T.n, T.cat || "video", delta);
  const d = dayKey(); S.days[d] = (S.days[d]||0) + delta;

    S.itemSec = S.itemSec || {}; S.itemSec[T.n] = S.itemSec[T.n] || {};
    S.itemSec[T.n][T.item] = (S.itemSec[T.n][T.item] || 0) + delta;
  }
  T.committed = e;

function startTimer(n, item, cat){
  if (T.on) commitTimer();

}

function segOf(n){
  const o = (S.seg && S.seg[n]) || {};
  const r = {}; CATS.forEach(c => { if (c.k !== "none") r[c.k] = o[c.k] || 0; });
  return r;
}
function segLine(n){
  const o = segOf(n); let parts = [];
  CATS.forEach(c => { if (c.k !== "none" && o[c.k] > 0) parts.push(c.t + " <b>" + fmtLong(o[c.k]) + "</b>"); });
  if (!parts.length) return "";
  return "本课分环节：" + parts.join(" · ");
}
function segTotals(){
  const r = {video:0, hw:0, make:0, read:0}; let classified = 0;
  if (S.seg) for (const n in S.seg){
    const o = S.seg[n] || {};
    for (const k in r){ const v = o[k] || 0; r[k] += v; classified += v; }
  }
  const total = totalSecs();
  const none = Math.max(0, total - classified);
  return {cats: r, none, total: Math.max(total, classified)};
}
function pieHTML(){
  const st = segTotals();
  const rows = [];
  CATS.forEach(c => { const v = c.k === "none" ? st.none : st.cats[c.k]; if (v > 0) rows.push({t: c.t, c: c.c, v: v}); });
  if (!rows.length) return '<div class="empty">还没有分环节的计时。到课程页点「开始计时」，并选一下当时在做哪一步（看视频 / 作业 / 造句 / 跟读），这里就会出饼图。</div>';
  rows.sort((a, b) => b.v - a.v);
  const sum = rows.reduce((s, r) => s + r.v, 0);
  const R = 72, SW = 26, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = rows.map(r => {
    const len = Math.max(0.6, r.v / sum * C);
    const s = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${r.c}" stroke-width="${SW}"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 100 100)"/>`;
    off += len;
    return s;
  }).join("");
  const hrs = st.total >= 3600 ? (st.total / 3600).toFixed(1) : "";
  const centerTop = hrs || String(Math.round(st.total / 60));
  const centerBot = hrs ? "小时" : "分钟";
  const leg = rows.map(r => {
    const pc = Math.round(r.v / sum * 100);
    return `<div class="row"><span class="dot" style="background:${r.c}"></span><span class="nm">${r.t}</span>
      <span class="tm">${fmtLong(r.v)}</span><span class="pc">${pc}%</span></div>`;
  }).join("");
  const top = rows[0];
  const topPc = Math.round(top.v / sum * 100);
  const onlyNone = rows.length === 1 && top.t === "未分类";
  const note = onlyNone
    ? "这些时长是「分环节统计」上线之前记的，暂时只能算在一起。下次开始计时时点一下当时在做哪一步，就能分开统计。"
    : `最费时间的是 <b>${top.t}</b>，占 <b>${topPc}%</b>。` + (st.none > 0 ? "「未分类」是加上分环节统计之前的老计时记录，不影响总数。" : "");
  return `
  <div class="pieWrap">
    <svg viewBox="0 0 200 200" width="176" height="176" role="img" aria-label="各环节用时占比">
      <circle cx="100" cy="100" r="${R}" fill="none" stroke="#e6eef8" stroke-width="${SW}"/>
      ${arcs}
      <text x="100" y="96" text-anchor="middle" font-size="26" font-family="Georgia,serif" fill="#152a45">${centerTop}</text>
      <text x="100" y="116" text-anchor="middle" font-size="12" fill="#61758c">${centerBot}</text>
    </svg>
    <div class="pieLeg">${leg}</div>
  </div>
  <div class="note-box" style="margin-top:10px">${note}</div>`;
}
/* 离开页面不停止计时：切后台/切标签/手机回桌面都按真实时间继续累计 */
const RUN_GAP_MAX = 12 * 3600 * 1000;   // 超过 12 小时视为忘了关，按最后一次记录截止
document.addEventListener("visibilitychange", ()=>{
  if (!T.on) return;
  if (document.hidden){ commitTimer(); return; }   // 存盘，继续跑
  const gap = Date.now() - T.startAt;
  if (gap > RUN_GAP_MAX){
    T.on = false; delete S.run; T.n = null; T.item = null;
    save(); toast("离开超过 12 小时，已按最后记录截止");
  }
  render();
});
function restoreRun(){
  const r = S.run;
  if (!r || typeof r !== "object") return;
  const n = +r.n;
  if (!(n >= 1 && n <= TOTAL) || !r.start) { delete S.run; return; }
  const gap = Date.now() - r.start;
  if (gap > RUN_GAP_MAX || gap < 0){ delete S.run; save(); return; }
  T.n = n; T.item = r.item || null; T.cat = CATS.some(c => c.k === r.cat) ? r.cat : "video";
  T.base = baseOf(n, T.item); T.startAt = r.start; T.committed = T.base; T.on = true;
  if (!tickHandle) tickHandle = setInterval(onTick, 1000);
  toast("继续上次的计时：第 " + n + " 课");
}

function renderTimer(){
  const v = location.hash || "#/home";
  const m = v.match(/^#\/lesson\/(\d+)/);
  if (!m) return;
  const n = +m[1];
  const tv = $("timer"); if (!tv) return;
  tv.textContent = fmt(T.on && T.n === n ? elapsed() : (T.n === n && T.item ? itemSecOf(n, T.item) : (S.secs[n] || 0)));
  const mt = $("metaTime"); if (mt) mt.innerHTML = metaTimeHTML(n);
  const btn = $("btnTimer"); if (btn) btn.textContent = (T.on && T.n === n) ? "暂停" : "开始听课计时";
  const lbl = $("runLabel"); if (lbl) lbl.innerHTML = nowLabel(n);
}

function go(h){ if (T.on) commitTimer(); location.hash = h; }
function render(){
  const h = location.hash || "#/home";
  const m = h.match(/^#\/lesson\/(\d+)/);
  const app = $("app");
  if (m) app.innerHTML = viewLesson(Math.min(TOTAL, Math.max(1, +m[1])));
  else if (h.startsWith("#/stats")) app.innerHTML = viewStats();
  else app.innerHTML = viewHome();
  if (T.on) renderTimer();
}

function viewStats(){
  const g = goalInfo();
  const tot = totalSecs();
  const timedN = LESSONS.filter(l => (S.secs[l.n] || 0) > 0).length;
  const avg = timedN ? Math.round(tot / timedN) : 0;
  const days = [];
  for (let i = 6; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push({k:dayKey(d), label:["日","一","二","三","四","五","六"][d.getDay()]}); }
  const max = Math.max(60, ...days.map(d => S.days[d.k]||0));
  const anyTime = days.some(d => S.days[d.k]);
  const bars = days.map(d => { const v = S.days[d.k]||0;
    return `<div><i style="height:${Math.round(v/max*76)+3}px"></i><span>${d.label}</span><em>${v?Math.round(v/60):""}</em></div>`; }).join("");
  let list = "";
  const top = LESSONS.filter(l => S.secs[l.n]).sort((a,b)=>S.secs[b.n]-S.secs[a.n]).slice(0,5);
  if (top.length) list = top.map(l => `<div class="w"><b>第 ${l.n} 课</b><span class="ipa"></span><span class="note">${fmtLong(S.secs[l.n])}</span></div>`).join("");
  const studyDays = Object.keys(S.days || {}).filter(k => (S.days[k]||0) > 0).length;
  /* 每条作业/任务用时排行 */
  const items = [];
  for (const n in (S.itemSec || {})){
    const L = LESSONS[+n - 1]; if (!L) continue;
    for (const id in S.itemSec[n]){
      const sec = S.itemSec[n][id] || 0; if (sec < 30) continue;
      const t = (L.hw || [])[+String(id).slice(1)] || {};
      items.push({n: +n, t: t.t || "任务", sec: sec});
    }
  }
  items.sort((a, b) => b.sec - a.sec);
  const itemList = items.slice(0, 8).map(x => `<div class="w"><b>第 ${x.n} 课</b><span class="ipa">${esc(String(x.t).slice(0, 22))}</span><span class="note">${fmtLong(x.sec)}</span></div>`).join("");
  const itemSum = items.reduce((a, x) => a + x.sec, 0);
  return `
  <div class="lessonHead">
    <button class="back" onclick="go('#/home')">← 课程表</button>
    <div><div class="ln">学习记录</div><div class="ls">累计投入 · 环节分布 · 近 7 天节奏</div></div>
  </div>
  <section class="card">
    <div class="statsRow">
      <div><b>${fmtLong(tot)}</b><span>累计学习时长</span></div>
      <div><b>${g.done}</b><span>已完成课数</span></div>
      <div><b>${fmtLong(avg)}</b><span>平均每节（有计时）</span></div>
      <div><b>${studyDays}</b><span>有计时的天数</span></div>
    </div>
  </section>
  <section class="card">
    <div class="secTitle" style="margin:0 0 2px"><h2>时间花在哪了</h2><span class="hint">按学习环节拆分</span></div>
    ${pieHTML()}
  </section>
  <section class="card">
    <div class="secTitle" style="margin:0 0 2px"><h2>近 7 天</h2><span class="hint">单位：分钟</span></div>
    <div class="bar">${bars}</div>
    <div class="note-box" style="margin-top:6px">${anyTime ? "今天学了 <b>" + fmtLong(S.days[dayKey()]||0) + "</b>，已学 " + dayDone() + " 课。" : "还没有计时记录 —— 在课程页点「开始计时」，每天的学习柱条就会出现在这里。"}</div>
  </section>
  <section class="card">
    <div class="secTitle" style="margin:0 0 2px"><h2>花时间最多的课</h2><span class="hint">Top 5</span></div>
    ${list || '<div class="empty">还没有计时记录，去课程页点「开始计时」。</div>'}
  </section>
  <section class="card">
    <div class="secTitle" style="margin:0 0 2px"><h2>每条作业花了多少时间</h2><span class="hint">按任务计时 · Top 8</span></div>
    ${itemList || '<div class="empty">还没按任务计时。到课程页点任意一条作业，就会开始给它记时；「结束」后这里能看到每条用了多久。</div>'}
    ${items.length ? `<div class="note-box" style="margin-top:8px">共记录 ${items.length} 条任务，合计 <b>${fmtLong(itemSum)}</b>；同一条作业分几次做，时间会自动累加。</div>` : ""}
  </section>`;
}

/* ---------- 操作 ---------- */
function toggleTask(n, id){
  S.tasks[n] = S.tasks[n] || {};
  if (S.tasks[n][id]) delete S.tasks[n][id]; else S.tasks[n][id] = dayKey();
  save(); render();
}
function countSentences(t){
  if (!t) return 0;
  return t.split(/[.!?\n]+/).map(s => s.trim())
          .filter(s => s.replace(/[^A-Za-z]/g, "").length >= 2).length;
}
function onMakeInput(n, id, val){
  S.make = S.make || {};
  const key = n + "_" + id;
  S.make[key] = val;
  const cnt = countSentences(val);
  const task = (LESSONS[n-1].hw || [])[+id.slice(1)] || {};
  const target = task.n || 0;
  const numEl = document.getElementById("mkn-" + key);
  if (numEl) numEl.textContent = cnt + (target ? " / " + target : "") + " 句";
  const tip = document.getElementById("mkt-" + key);
  if (tip){
    const ok = target > 0 && cnt >= target;
    tip.classList.toggle("ok", ok);
    tip.textContent = target > 0 ? (ok ? "已达标，作业已自动勾选" : "还差 " + (target - cnt) + " 句") : "自动保存";
  }
  if (target > 0 && cnt >= target){
    S.tasks[n] = S.tasks[n] || {};
    if (!S.tasks[n][id]){
      S.tasks[n][id] = dayKey();
      const el = document.querySelector('[data-tid="' + n + "-" + id + '"]');
      if (el) el.classList.add("on");
      toast("造句达标，作业已勾选");
    }
  }
  save();
}
function clearMake(n, id){
  if (!confirm("清空这一课的造句内容？")) return;
  S.make = S.make || {};
  delete S.make[n + "_" + id];
  if (S.tasks[n]) delete S.tasks[n][id];
  save(); render();
}
function markDone(n){
  if (S.done[n]){ delete S.done[n]; delete S.marks[n]; toast("已取消第 " + n + " 课的完成标记"); }
  else { S.done[n] = 1; S.marks[n] = dayKey(); toast("第 " + n + " 课完成，继续保持"); }
  save(); render();
}
function resetTimer(n){
  if (!confirm("清零第 " + n + " 课的计时记录？累计时长、环节分布、单条作业用时都会一并扣除。")) return;
  if (T.on && T.n === n){ T.on = false; delete S.run; T.n = null; T.item = null; }
  S.secs[n] = 0;
  if (S.seg) delete S.seg[n];
  if (S.itemSec) delete S.itemSec[n];
  save(); render();
}
function openSettings(){
  const el = document.getElementById("setCard");
  if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
  else toast("先回首页");
}
function setGoal(v){ if (!v) return; S.goal = v; save(); render(); toast("目标日已更新"); }
function setProgress(){
  const v = Math.min(144, Math.max(0, parseInt($("progInput").value||"0",10)));
  if (!confirm("把已完成进度设为前 " + v + " 课？之后课次的完成状态会被清掉。")) return;
  S.done = {}; S.marks = {};
  for (let i = 1; i <= v; i++) S.done[i] = 1;
  S.start = v; save(); render(); toast("进度已同步为 " + v + " 课");
}
function resetAll(){
  if (!confirm("清空全部记录（进度、计时、作业勾选）？不可恢复。")) return;
  localStorage.removeItem(KEY); S = defaultState(); save(); render(); toast("已重置");
}
/* 导出 / 导入：保底备份，任何设备任何场景都能用 */
function exportProgress(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  const d = new Date(), p = n => String(n).padStart(2,"0");
  a.href = URL.createObjectURL(blob);
  a.download = "新概念一进度_" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  toast("已导出进度文件");
}
function normalizeState(o){
  const seg = {};
  if (o.seg && typeof o.seg === "object"){
    for (const n in o.seg){
      if (typeof o.seg[n] !== "object") continue;
      seg[n] = {};
      for (const k in o.seg[n]){ const v = +o.seg[n][k]; if (v > 0) seg[n][k] = v; }
    }
  }
  const itemSec = {};
  if (o.itemSec && typeof o.itemSec === "object"){
    for (const n in o.itemSec){
      if (typeof o.itemSec[n] !== "object") continue;
      itemSec[n] = {};
      for (const id in o.itemSec[n]){ const v = +o.itemSec[n][id]; if (v > 0) itemSec[n][id] = v; }
    }
  }
  return Object.assign(defaultState(), {
    done: o.done || {}, marks: o.marks || {}, secs: o.secs || {}, days: o.days || {},
    seg: seg, itemSec: itemSec, lastCat: CATS.some(c => c.k === o.lastCat) ? o.lastCat : "video",
    tasks: o.tasks || {}, make: o.make || {}, lastN: o.lastN || 41,
    goal: o.goal || thisYearEnd(), start: (typeof o.start === "number" ? o.start : 0),
    updatedAt: o.updatedAt || ""
  });
}
function importProgress(inp){
  const f = inp.files && inp.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let o = null;
    try { o = JSON.parse(r.result); } catch(e) { o = null; }
    if (o && o.state && typeof o.state === "object") o = o.state;
    if (!o || typeof o !== "object" || !o.done || typeof o.done !== "object"){
      toast("这个文件不是导出的进度"); inp.value = ""; return;
    }
    if (!confirm("用这份进度覆盖当前记录？当前记录会被替换。")) { inp.value = ""; return; }
    localStorage.setItem(GIST_BACKUP_KEY, JSON.stringify(S));
    S = normalizeState(o);
    save(); render(); toast("进度已导入");
    inp.value = "";
  };
  r.readAsText(f);
}

/* ---------- GitHub Gist 同步 ---------- */
function gistCfg(){
  try { return {token: localStorage.getItem(GIST_TOKEN_KEY) || "", id: localStorage.getItem(GIST_ID_KEY) || ""}; }
  catch(e){ return {token:"", id:""}; }
}
function gistStatus(){
  const c = gistCfg();
  if (!c.token) return "未配置 Token";
  if (!c.id) return "有 Token · 还没建 Gist";
  let last = "";
  try { last = localStorage.getItem(GIST_LAST_KEY) || ""; } catch(e){}
  return "已连接" + (last ? " · 上次同步 " + last : "");
}
function setGistToken(v){
  try { v ? localStorage.setItem(GIST_TOKEN_KEY, v.trim()) : localStorage.removeItem(GIST_TOKEN_KEY); } catch(e){}
  toast(v ? "Token 已保存在本机" : "Token 已清除"); render();
}
function setGistId(v){
  try { v.trim() ? localStorage.setItem(GIST_ID_KEY, v.trim()) : localStorage.removeItem(GIST_ID_KEY); } catch(e){}
  toast("Gist ID 已保存"); render();
}
async function ghFetch(path, opt){
  const c = gistCfg();
  if (!c.token) throw new Error("先填 GitHub Token");
  const res = await fetch("https://api.github.com" + path, Object.assign({}, opt, {headers:{
    "Authorization": "Bearer " + c.token,
    "Accept": "application/vnd.github+json",
    "Content-Type": "application/json"
  }}));
  if (!res.ok){
    let msg = "";
    try { msg = (await res.json()).message || ""; } catch(e){}
    throw new Error("GitHub " + res.status + (msg ? "：" + msg : ""));
  }
  return res.json();
}
function gistPayload(){
  return JSON.stringify({app:"nce1", version:1, updatedAt:S.updatedAt || "", state:S}, null, 2);
}
async function gistCreate(){
  const c = gistCfg();
  if (!c.token) return toast("先在设置里填 GitHub Token");
  try {
    const d = await ghFetch("/gists", {method:"POST", body: JSON.stringify({
      description: "新概念英语一 · 跟课打卡进度",
      public: false,
      files: {[GIST_FILE]: {content: gistPayload()}}
    })});
    localStorage.setItem(GIST_ID_KEY, d.id);
    localStorage.setItem(GIST_LAST_KEY, new Date().toLocaleString("zh-CN", {hour12:false}));
    toast("Gist 已创建，ID 已填入");
    render();
  } catch(e){ toast("创建失败：" + e.message); }
}
async function gistPush(){
  const c = gistCfg();
  if (!c.token) throw new Error("先填 GitHub Token");
  if (!c.id){ await gistCreate(); return; }
  await ghFetch("/gists/" + c.id, {method:"PATCH", body: JSON.stringify({
    files: {[GIST_FILE]: {content: gistPayload()}}
  })});
  localStorage.setItem(GIST_LAST_KEY, new Date().toLocaleString("zh-CN", {hour12:false}));
}
async function gistPull(){
  const c = gistCfg();
  if (!c.id) throw new Error("还没有 Gist ID");
  const d = await ghFetch("/gists/" + c.id);
  const f = d.files && d.files[GIST_FILE];
  if (!f) throw new Error("云端还没有进度文件");
  let txt = f.content;
  if (f.truncated && f.raw_url) txt = await (await fetch(f.raw_url)).text();
  const o = JSON.parse(txt);
  const st = o.state || o;
  if (!st || !st.done) throw new Error("云端文件格式不对");
  localStorage.setItem(GIST_BACKUP_KEY, JSON.stringify(S));
  S = normalizeState(st);
  save();
  localStorage.setItem(GIST_LAST_KEY, new Date().toLocaleString("zh-CN", {hour12:false}));
  render();
}
async function gistSync(mode){
  const c = gistCfg();
  if (!c.token) return toast("先在设置里填 GitHub Token");
  try {
    if (!c.id){
      if (mode === "pull") return toast("还没有 Gist ID，先新建或粘贴");
      await gistCreate();
      return;
    }
    const d = await ghFetch("/gists/" + c.id);
    const f = d.files && d.files[GIST_FILE];
    let remote = null;
    if (f){
      let txt = f.content;
      if (f.truncated && f.raw_url) txt = await (await fetch(f.raw_url)).text();
      remote = JSON.parse(txt);
    }
    const remoteTime = (remote && remote.updatedAt) || "";
    const localTime = S.updatedAt || "";
    let dir = mode;
    if (mode === "auto"){
      dir = (remoteTime && (!localTime || remoteTime > localTime)) ? "pull" : "push";
    }
    if (dir === "pull"){
      if (!remote) return toast("云端还没有进度，先点「只上传」");
      if (!confirm("云端进度比本机新，用云端覆盖本机？本机会先留一份备份。")) return;
      const st = remote.state || remote;
      localStorage.setItem(GIST_BACKUP_KEY, JSON.stringify(S));
      S = normalizeState(st); save(); render(); toast("已拉取云端进度");
    } else {
      await gistPush();
      toast("已上传到云端");
    }
    render();
  } catch(e){ toast("同步失败：" + e.message); }
}
window.addEventListener("hashchange", render);
/* ---------- PWA ---------- */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
restoreRun();
render();
</script>
